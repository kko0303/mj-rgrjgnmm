<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#061310">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>雀卓スコア</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#061310; --felt:#0B2019; --felt2:#102D23; --felt3:#16382B; --line:#1C4536;
  --ink:#E9F2EC; --dim:#8AA89A; --faint:#5C7A6D;
  --gold:#E0B252; --red:#D2564A; --pos:#5FBF95; --blue:#4285C7;
  --jp:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --num:"Barlow Semi Condensed",-apple-system,"Hiragino Sans",sans-serif;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:14px;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column}
#bar{flex:none;height:42px;display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;background:#04100C;border-bottom:1px solid var(--line);gap:8px}
#bar .mid{font-family:var(--mincho);font-size:18px;display:flex;align-items:baseline;gap:8px}
#bar .mid span{font-family:var(--num);font-size:13px;color:var(--dim)}
.barbtn{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--dim);border:1px solid transparent}
.barbtn:active{background:var(--felt2)}
.barbtn[disabled]{opacity:.3}

#table{flex:1;display:grid;min-height:0;
  grid-template-columns:1.15fr 2fr 1.15fr;grid-template-rows:1fr 1.35fr 1fr;
  background:radial-gradient(ellipse at center,#12402F 0%,#0C2C20 48%,#061913 100%);
  gap:5px;padding:5px}
.corner{display:flex;align-items:center;justify-content:center;padding:6px}
.c-tl{grid-area:1/1;justify-content:flex-start;align-items:flex-start}
.c-tr{grid-area:1/3}.c-bl{grid-area:3/1}
.c-br{grid-area:3/3;justify-content:flex-end;align-items:flex-end}
.seat{position:relative;overflow:hidden;border-radius:10px;
  background:linear-gradient(180deg,#0E2A20,#09201A);border:2px solid #2A5B46}
.s0{grid-area:3/2}.s1{grid-area:2/3}.s2{grid-area:1/2}.s3{grid-area:2/1}
.seat.dealer{border-color:var(--gold)}
.seat.wall::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:8px;
  animation:wallFlash .82s infinite}
.s0.wall::before{background:linear-gradient(180deg,rgba(110,182,240,.5),rgba(90,169,230,0) 58%);
  box-shadow:inset 0 6px 0 #8CCBFF,inset 0 14px 26px -6px rgba(140,203,255,.6)}
.s2.wall::before{background:linear-gradient(0deg,rgba(110,182,240,.5),rgba(90,169,230,0) 58%);
  box-shadow:inset 0 -6px 0 #8CCBFF,inset 0 -14px 26px -6px rgba(140,203,255,.6)}
.s1.wall::before{background:linear-gradient(90deg,rgba(110,182,240,.5),rgba(90,169,230,0) 58%);
  box-shadow:inset 6px 0 0 #8CCBFF,inset 14px 0 26px -6px rgba(140,203,255,.6)}
.s3.wall::before{background:linear-gradient(270deg,rgba(110,182,240,.5),rgba(90,169,230,0) 58%);
  box-shadow:inset -6px 0 0 #8CCBFF,inset -14px 0 26px -6px rgba(140,203,255,.6)}
@keyframes wallFlash{0%,44%{opacity:1}52%,100%{opacity:0}}
.seat .rot{position:absolute;top:50%;left:50%;transform-origin:center;
  display:flex;flex-direction:column;justify-content:center;gap:4px;padding:7px 10px}
.s0 .rot{transform:translate(-50%,-50%)}
.s1 .rot{transform:translate(-50%,-50%) rotate(-90deg)}
.s2 .rot{transform:translate(-50%,-50%) rotate(180deg)}
.s3 .rot{transform:translate(-50%,-50%) rotate(90deg)}
.nameRow{display:flex;align-items:center;gap:7px;min-height:24px}
.wbadge{font-family:var(--mincho);font-size:15px;line-height:1;padding:3px 6px;border-radius:5px;
  background:var(--gold);color:#1a1205;flex:none}
.wbadge.oya{background:var(--red);color:#fff}
.pname{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;text-align:left}
.infoRow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.rankBox{font-family:var(--num);font-size:15px;line-height:1.25;color:var(--dim);text-align:left;flex:none}
.rankBox b{color:var(--ink);font-weight:700}
.rankBox b.r1{color:var(--gold)}
.rankBox small{display:block;font-size:11px;color:var(--faint);font-family:var(--jp);white-space:nowrap}
.rankBox small .gu{color:#E08C7A;font-style:normal}
.rankBox small .gd{color:#5FBF95;font-style:normal}
.pts{font-family:var(--num);font-weight:700;font-size:clamp(28px,6.2vh,52px);line-height:1;
  letter-spacing:-.01em;font-variant-numeric:tabular-nums;text-align:right;flex:1}
.pts.neg{color:var(--red)}
.calc{font-family:var(--num);font-variant-numeric:tabular-nums;text-align:right;flex:none;line-height:1.15}
.calc .a{font-size:clamp(15px,2.6vh,20px);color:var(--dim)}
.calc .b{font-size:clamp(15px,2.6vh,20px)}
.calc .b.up{color:var(--pos)}.calc .b.down{color:var(--red)}
.calc .c{font-size:clamp(24px,5vh,42px);font-weight:700;border-top:1px solid var(--dim);
  padding-top:1px;margin-top:1px}
.btnRow{display:flex;gap:6px;align-items:center}
.btnRow .sp{flex:1}
.sbtn{padding:7px 0;min-width:62px;text-align:center;border-radius:7px;font-size:14px;
  background:linear-gradient(180deg,#3A6FA8,#2C5988);border:1px solid #5A92C8;color:#fff}
.sbtn:active{filter:brightness(1.25)}
.sbtn.on{background:linear-gradient(180deg,#D2564A,#A8382E);border-color:#E87A6F}
.sbtn.big{flex:1;padding:14px 0;font-size:17px;font-weight:600}
.sbtn.dan{background:linear-gradient(180deg,#B8443A,#8E2E26);border-color:#D2564A}
.sbtn.ok{background:linear-gradient(180deg,#3E9E77,#2B7457);border-color:#5FBF95}
.sbtn[disabled]{opacity:.95;cursor:default}
.sbtn small{display:block;font-size:11px;opacity:.85;font-weight:400}
.sbtn.cancel{background:linear-gradient(180deg,#3A6FA8,#2C5988)}
.delta{position:absolute;top:50%;left:50%;font-family:var(--num);font-weight:700;font-size:26px;opacity:0;pointer-events:none}
.up{color:var(--pos)}.down{color:var(--red)}

#center{grid-area:2/2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.tray{width:min(40vh,190px);aspect-ratio:1;border-radius:16px;
  background:linear-gradient(145deg,#4A4E4C,#2A2E2C);display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.well{width:72%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#1F6E4E,#0E3A28);
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.6)}
.die{width:26px;height:26px;border-radius:5px;background:#F4F2EC;display:grid;
  grid-template:repeat(3,1fr)/repeat(3,1fr);padding:3px;box-shadow:0 2px 3px rgba(0,0,0,.5)}
.die>div{display:grid;place-items:center}
.die i{display:block;width:5px;height:5px;border-radius:50%;background:#1a1205}
.die i.r{background:#C03A2E}
.die.roll{animation:tumble .5s ease-out}
@keyframes tumble{0%{transform:rotate(0) scale(.6)}55%{transform:rotate(220deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
.trayWrap{position:relative;display:grid;place-items:center;padding:40px}
.rstick{position:absolute;background:linear-gradient(180deg,#FFFFFF,#DCD9CF);border-radius:4px;
  box-shadow:0 3px 6px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.9)}
.rstick::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:6px;height:6px;border-radius:50%;background:#C0392B}
.rstick.p0{bottom:2px;left:50%;margin-left:-38px;width:76px;height:12px}
.rstick.p2{top:2px;left:50%;margin-left:-38px;width:76px;height:12px}
.rstick.p1{right:2px;top:50%;margin-top:-38px;width:12px;height:76px;
  background:linear-gradient(90deg,#FFFFFF,#DCD9CF)}
.rstick.p3{left:2px;top:50%;margin-top:-38px;width:12px;height:76px;
  background:linear-gradient(90deg,#FFFFFF,#DCD9CF)}
.rstick.drop{animation:stickDrop .34s cubic-bezier(.2,.9,.3,1.2)}
@keyframes stickDrop{0%{opacity:0;transform:scale(.4) rotate(-12deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.pool{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;
  gap:3px;pointer-events:none}
.diceTxt{font-family:var(--num);font-size:13px;color:var(--dim);text-align:center;max-width:90%}
.diceTxt b{color:var(--pos)}
.kyotaku{display:flex;flex-direction:column;gap:5px;font-family:var(--num);font-size:13px;color:var(--dim)}
.kyotaku div{display:flex;align-items:center;gap:7px}
.stick{width:44px;height:7px;border-radius:4px;background:#E8E6DE;position:relative;flex:none;
  box-shadow:0 1px 2px rgba(0,0,0,.4)}
.stick.b1000::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:4px;height:4px;border-radius:50%;background:var(--red)}
.stick.b100::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:22px;height:3px;background:repeating-linear-gradient(90deg,var(--red) 0 2px,transparent 2px 4px)}

/* 画面 */
.screen{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.shead{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;background:#04100C;border-bottom:1px solid var(--line)}
.shead .t{font-size:16px}
.sbody{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sfoot{flex:none;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-top:1px solid var(--line);background:#04100C}
.panel{width:min(560px,100%);border:1px solid var(--line);border-radius:12px;background:var(--felt);overflow:hidden}
.panel .ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.readout{padding:12px 16px;text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;
  font-size:44px;font-weight:700;line-height:1;border-bottom:1px solid var(--line);min-height:70px}
.readout small{display:block;font-size:13px;color:var(--dim);font-family:var(--jp);font-weight:400;margin-top:4px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:11px 4px;font-size:14px;color:var(--dim);background:var(--felt2);border-right:1px solid var(--line)}
.tabs button:last-child{border-right:0}
.tabs button.on{background:var(--gold);color:#1a1205;font-weight:600}
.pad{display:grid;gap:6px;padding:10px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
.g7{grid-template-columns:repeat(7,1fr)}
.k{padding:12px 2px;text-align:center;border-radius:7px;font-family:var(--num);font-size:15px;font-weight:600;
  background:linear-gradient(180deg,#3A6FA8,#2C5988);border:1px solid #5A92C8;color:#fff;
  font-variant-numeric:tabular-nums}
.k.hi{background:linear-gradient(180deg,#B8443A,#8E2E26);border-color:#D2564A}
.k.plain{background:var(--felt2);border-color:var(--line);color:var(--ink)}
.k.on{background:var(--gold);border-color:var(--gold);color:#1a1205}
.k[disabled]{opacity:.3}
.wtabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wtabs button{padding:6px 11px;border-radius:7px;border:1px solid var(--line);font-size:13px;color:var(--dim)}
.wtabs button.on{border-color:var(--gold);color:var(--ink);background:var(--felt3)}
.wtabs .add{border-style:dashed;color:var(--gold)}

.btn{padding:10px 18px;border-radius:9px;border:1px solid var(--line);background:var(--felt2);font-size:14px;color:var(--ink)}
.btn:active{background:var(--felt3)}
.btn.primary{background:linear-gradient(180deg,#B8443A,#8E2E26);border-color:#D2564A;color:#fff;font-weight:600}
.btn.gold{background:var(--gold);color:#1a1205;border-color:var(--gold);font-weight:600}
.btn.ghost{background:transparent;color:var(--dim)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.35}

.overlay{position:fixed;inset:0;background:rgba(3,9,7,.86);z-index:60;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:var(--felt);border:1px solid var(--line);border-radius:16px;width:min(760px,96vw);
  max-height:94%;overflow:auto;padding:16px;transform-origin:center}
.card h2{margin:0 0 4px;font-size:17px;font-weight:600}
.card .lead{margin:0 0 12px;font-size:12px;color:var(--dim)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.lbl{font-size:11px;color:var(--faint);letter-spacing:.08em;width:100%;margin-bottom:-2px}
.chip{padding:8px 14px;border-radius:9px;border:1px solid var(--line);font-size:14px;color:var(--dim);background:var(--felt2)}
.chip.on{border-color:var(--gold);color:var(--ink);background:var(--felt3)}
.seatGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.seatCard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--felt2);
  display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-height:70px}
.seatCard.on{border-color:var(--gold)}
.seatCard .w{font-family:var(--mincho);font-size:19px;color:var(--gold)}
.seatCard .n{font-size:16px}
.seatCard .n.empty{color:var(--faint)}
.seatCard .n{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}
.vrow{display:flex;gap:6px;align-items:center;width:100%;margin-top:4px}
.vsel{flex:1;min-width:0;background:var(--felt);border:1px solid var(--line);border-radius:7px;
  padding:6px 7px;color:var(--ink);font:inherit;font-size:12px}
.vplay{flex:none;padding:5px 9px;border-radius:7px;border:1px solid var(--line);background:var(--felt);font-size:12px}
.yomi{width:120px;background:var(--felt);border:1px solid var(--line);border-radius:7px;
  padding:5px 7px;color:var(--ink);font:inherit;font-size:12px}
.yomi::placeholder{color:var(--faint)}
.mem{display:flex;gap:6px;flex-wrap:wrap}
.mem button{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--felt2);font-size:14px}
.mem button.used{opacity:.32}
.mem button.on{border-color:var(--gold);background:var(--felt3)}
table{border-collapse:collapse;width:100%;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-family:var(--jp)}
th{font-family:var(--jp);font-size:11px;color:var(--faint);font-weight:500}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sec{margin:18px 0 8px;font-size:12px;color:var(--faint);letter-spacing:.08em}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
.field input,.field select{background:var(--felt2);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;color:var(--ink);font:inherit;font-size:14px;min-width:0;width:100%}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sw small{display:block;color:var(--faint);font-size:11px;margin-top:2px}
.toggle{width:46px;height:27px;border-radius:999px;background:var(--felt3);border:1px solid var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--faint);transition:.15s}
.toggle.on{background:rgba(224,178,82,.25);border-color:var(--gold)}
.toggle.on::after{left:21px;background:var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin:8px 0}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px}
svg text{font-family:var(--num);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--faint);line-height:1.6}
.warn{font-size:12px;color:var(--gold);text-align:center}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);margin-right:6px}
.syncdot.ok{background:var(--pos)}.syncdot.err{background:var(--red)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:700px){
  .sbtn{min-width:52px;font-size:13px;padding:6px 0}
  .pts{font-size:clamp(22px,5vh,34px)}
  .readout{font-size:34px}
}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button class="barbtn" id="btnUndo">取り消し</button>
    <div class="mid" id="barMid"></div>
    <button class="barbtn" id="btnMenu">メニュー</button>
  </div>
  <div id="table">
    <div class="corner c-tl" id="cTL"></div>
    <div class="corner c-tr" id="cTR"></div>
    <div class="corner c-bl" id="cBL"></div>
    <div class="corner c-br" id="cBR"></div>
    <div class="seat s0" data-seat="0"></div>
    <div class="seat s1" data-seat="1"></div>
    <div class="seat s2" data-seat="2"></div>
    <div class="seat s3" data-seat="3"></div>
    <div id="center"></div>
  </div>
</div>
<div id="scr" hidden></div>
<div id="ov" hidden></div>

<script src="config.js" onerror="void 0"></script>
<script>
"use strict";
const CFG=Object.assign({endpoint:"",key:""},window.JT_CONFIG||{});
const K={r:"jt2.rules",g:"jt2.game",h:"jt2.recs",m:"jt2.members",rot:"jt2.rot",p:"jt2.pending"};
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const $=(s,r=document)=>r.querySelector(s);
const ce=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ceil100=x=>Math.ceil(x/100)*100;
const r1=x=>Math.round(x*10)/10;
const fmt=n=>Math.round(n).toLocaleString("ja-JP");
const sgn=n=>(n>0?"+":"")+fmt(n);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---- ルール ---- */
const UMA={"なし":[0,0,0,0],"5-10":[10,5,-5,-10],"10-20":[20,10,-10,-20],"10-30":[30,10,-10,-30],"20-30":[30,20,-20,-30]};
const DEF={length:"hanchan",start:25000,ret:30000,umaKey:"10-20",oka:true,
  agariyame:true,tenpaiyame:true,rasuoya:false,kiriage:false,tobi:true,
  multiRon:"double",honbaToAll:true,atamahane:true,
  westEntry:true,westLine:30000,northEntry:false,
  yakitori:false,yakitoriPt:10000,warepai:false,voice:true,dice:true,
  gosha:true,rate:0,rateUnit:"コイン"};
let R=Object.assign({},DEF,LS.get(K.r,{}));
const saveRules=()=>{LS.set(K.r,R);touchSettings()};

/* ---- 名簿 ---- */
let MEM=LS.get(K.m,[]);
const saveMem=()=>{LS.set(K.m,MEM);touchSettings()};
function addMember(name){
  name=(name||"").trim().slice(0,12); if(!name) return null;
  const hit=MEM.find(m=>m.name===name); if(hit) return hit;
  const m={id:uid(),name,at:Date.now()}; MEM.push(m); saveMem(); return m;
}
function memberNames(){
  const set={}; MEM.forEach(m=>set[m.name]=1);
  RECS.forEach(r=>(r.rows||[]).forEach(x=>{if(x.name)set[x.name]=1}));
  return Object.keys(set);
}

function basePts(fu,han){
  if(han>=13)return 8000; if(han>=11)return 6000; if(han>=8)return 4000;
  if(han>=6)return 3000; if(han===5)return 2000;
  const b=fu*Math.pow(2,2+han);
  if(R.kiriage&&((han===4&&fu===30)||(han===3&&fu===60)))return 2000;
  return Math.min(b,2000);
}
function payTsumo(seat,base){
  return seat===dealer()?{each:ceil100(base*2)}:{ko:ceil100(base),oya:ceil100(base*2)};
}
const ronTotal=(seat,base)=>ceil100(base*(seat===dealer()?6:4));
function horaDeltas(wins,loser,tsumo){
  const d=[0,0,0,0],hand=[0,0,0,0],wp=R.warepai?S.warepai:null;
  const dbl=(payer,winner)=>(wp!==null&&(payer===wp||winner===wp))?2:1;
  if(tsumo){
    const w=wins[0];let got=0;
    if(w.rawT){
      for(let i=0;i<4;i++){ if(i===w.seat)continue;
        const b=w.seat===dealer()?w.rk:(i===dealer()?w.ro:w.rk);
        const pay=b+100*S.honba; d[i]-=pay; got+=pay; }
    }else{
      const p=payTsumo(w.seat,w.base);
      for(let i=0;i<4;i++){ if(i===w.seat)continue;
        const b=w.seat===dealer()?p.each:(i===dealer()?p.oya:p.ko);
        const pay=b*dbl(i,w.seat)+100*S.honba; d[i]-=pay; got+=pay; }
    }
    d[w.seat]+=got; hand[w.seat]=got;
  }else{
    let loss=0;
    wins.forEach((w,idx)=>{
      let pay=(w.raw!=null?w.raw:ronTotal(w.seat,w.base))*dbl(loser,w.seat);
      pay+=300*S.honba*(R.honbaToAll?1:(idx===0?1:0));
      d[w.seat]+=pay; hand[w.seat]=pay; loss+=pay;
    });
    d[loser]-=loss; hand[loser]=-loss;
  }
  // 供託（リーチ棒）
  const pot=S.kyotaku*1000;
  if(pot){
    if(tsumo||wins.length===1) d[wins[0].seat]+=pot;
    else{
      // 放銃者の下家から順に並べる（＝上家取りの順番）
      const order=[];
      for(let o=1;o<4;o++){const st=(loser+o)%4;if(wins.some(w=>w.seat===st))order.push(st)}
      if(R.atamahane) d[order[0]]+=pot;
      else{
        const base=Math.floor(pot/100/order.length)*100;
        const rest=pot-base*order.length;
        order.forEach((st,i)=>{d[st]+=base+(i===0?rest:0)});
      }
    }
  }
  return {d,hand};
}
/* 定数入力の一覧（親/子・ロン/ツモで切替） */
function fixedList(seat,tsumo){
  const oya=seat===dealer(), bases=[];
  const FUL=[20,25,30,40,50,60,70,80,90,100,110];
  for(const fu of FUL) for(let han=1;han<=4;han++){
    if(fu===20&&(han<2||!tsumo)) continue;
    if(fu===25&&han<2) continue;
    const b=fu*Math.pow(2,2+han);
    if(b>=2000) continue;
    bases.push(b);
  }
  [2000,3000,4000,6000,8000,16000,24000].forEach(b=>bases.push(b));
  const seen={},out=[];
  bases.sort((a,b)=>a-b).forEach(b=>{
    let label,total;
    if(tsumo){
      if(oya){const v=ceil100(b*2);total=v*3;label=fmt(v)+" all"}
      else{const k=ceil100(b),o=ceil100(b*2);total=k*2+o;label=fmt(k)+" / "+fmt(o)}
    }else{ total=ceil100(b*(oya?6:4)); label=fmt(total) }
    if(seen[label])return; seen[label]=1;
    out.push({base:b,label,total,big:b>=2000});
  });
  return out;
}

/* 動画・音声ファイルから必要な部分だけ切り出して小さなWAVにする */
function wavBlob(buf){
  const sr=buf.sampleRate,n=buf.length,d=buf.getChannelData(0);
  const bytes=44+n*2,dv=new DataView(new ArrayBuffer(bytes));let p=0;
  const str=t=>{for(let i=0;i<t.length;i++)dv.setUint8(p++,t.charCodeAt(i))};
  const u32=v=>{dv.setUint32(p,v,true);p+=4},u16=v=>{dv.setUint16(p,v,true);p+=2};
  str("RIFF");u32(bytes-8);str("WAVE");str("fmt ");u32(16);u16(1);u16(1);
  u32(sr);u32(sr*2);u16(2);u16(16);str("data");u32(n*2);
  for(let i=0;i<n;i++){const v=Math.max(-1,Math.min(1,d[i]));dv.setInt16(p,v<0?v*0x8000:v*0x7FFF,true);p+=2}
  return new Blob([dv.buffer],{type:"audio/wav"});
}
async function extractVoice(file,startSec,lenSec){
  const ab=await file.arrayBuffer();
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const buf=await new Promise((res,rej)=>ctx.decodeAudioData(ab,res,rej));
  try{ctx.close()}catch(e){}
  const st=Math.max(0,Math.min(startSec||0,Math.max(0,buf.duration-.1)));
  const ln=Math.max(.2,Math.min(lenSec||3,buf.duration-st,10));
  const sr=22050;
  const off=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,Math.ceil(sr*ln),sr);
  const src=off.createBufferSource();src.buffer=buf;
  const g=off.createGain();
  g.gain.setValueAtTime(0,0);g.gain.linearRampToValueAtTime(1,.02);
  g.gain.setValueAtTime(1,Math.max(.03,ln-.06));g.gain.linearRampToValueAtTime(0,ln);
  src.connect(g);g.connect(off.destination);src.start(0,st,ln);
  const out=await off.startRendering();
  return {blob:wavBlob(out),sec:Math.round(ln*10)/10};
}

const bufCache={};
async function playVoice(vid,name){
  if(!R.voice)return;
  const v=voiceById(vid);
  if(v.silent)return;
  if(v.chime){chime();return}
  if(v.synth){chime();setTimeout(()=>speak((name?yomiOf(name)+"、":"")+"リーチ",v.synth),260);return}
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")await AC.resume();
    let buf=bufCache[v.id];
    if(!buf){
      const ab=v.file?await (await fetch(v.file)).arrayBuffer():await v.blob.arrayBuffer();
      buf=await new Promise((res,rej)=>AC.decodeAudioData(ab,res,rej));
      bufCache[v.id]=buf;
    }

  }catch(e){chime()}
}
let AC=null;
function chime(){
  if(!R.voice)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const t0=AC.currentTime;
    [[880,0],[1318.5,.11]].forEach(([f,dt])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type="triangle";o.frequency.value=f;
      g.gain.setValueAtTime(0,t0+dt);
      g.gain.linearRampToValueAtTime(.22,t0+dt+.012);
      g.gain.exponentialRampToValueAtTime(.001,t0+dt+.26);
      o.connect(g);g.connect(AC.destination);
      o.start(t0+dt);o.stop(t0+dt+.28);
    });
  }catch(e){}
}

function advance(keep,honbaUp){
  if(R.tobi&&S.pts.some(p=>p<0))return finish("飛び終了");
  if(S.ext>0&&S.pts.some(p=>p>=R.westLine))return finish("サドンデス終了");
  const oorasu=isOorasu();
  if(oorasu&&keep){
    const rk=ranks(),d=dealer();
    if(R.rasuoya)return finish("ラス親流れ");
    if(honbaUp===false&&R.agariyame&&rk[d]===1)return finish("アガリ止め");
    if(honbaUp===true&&R.tenpaiyame&&rk[d]===1)return finish("テンパイ止め");
  }
  if(oorasu&&!keep){
    const maxExt=R.northEntry?2:1;
    if(R.westEntry&&S.ext<maxExt&&topPts()<R.westLine){
      S.ext++;S.round++;S.honba=honbaUp?S.honba+1:0;return startHand();
    }
    return finish(S.ext>0?"延長戦 終了":"終局");
  }
  if(keep){S.honba++;S.st[dealer()].renchan++}
  else{S.round++;S.honba=honbaUp?S.honba+1:0}
  startHand();
}

function startHora(seat,tsumo){
  UI={mode:tsumo?"score":"loser",tsumo,winners:[seat],loser:null,inputs:{},cur:0,tenpai:[]};
  if(tsumo)openScore(); else render();
}
function getInp(s){
  return UI.inputs[s]||(UI.inputs[s]={mode:"fix",fu:30,han:3,base:null,raw:null,rk:0,ro:0});
}
function winsFrom(){
  return UI.winners.map(s=>{
    const I=getInp(s);
    if(I.mode==="raw") return UI.tsumo?{seat:s,rawT:true,rk:I.rk||0,ro:I.ro||0,base:0}:{seat:s,base:0,raw:I.raw||0};
    return {seat:s,base:I.base||0};
  });
}
function winValue(s){
  const I=getInp(s);
  if(I.mode==="raw") return UI.tsumo?((I.rk||0)*(s===dealer()?3:2)+(s===dealer()?0:(I.ro||0))):(I.raw||0);
  if(!I.base) return 0;
  if(UI.tsumo){const p=payTsumo(s,I.base);return s===dealer()?p.each*3:p.ko*2+p.oya}
  return ronTotal(s,I.base);
}

      const b=ce("button",idx===UI.cur?"on":"",S.names[s]);

    });

      const rm=ce("button",null,"− 削除");
      rm.onclick=()=>{

        delete UI.inputs[s2];UI.cur=0;draw();
      };
      tabs.append(rm);
    }
    ph.append(tabs);
    if(!UI.tsumo&&UI.loser!=null) ph.append(ce("span","note","放銃 "+S.names[UI.loser]));
    pn.append(ph);
    // 表示

    let head="0",sub="";

      if(UI.tsumo){const p=payTsumo(seat,I.base);head=seat===dealer()?fmt(p.each)+" all":fmt(p.ko)+" / "+fmt(p.oya)}

    }
    if(I.mode==="fuhan"&&I.base){
      const ki=R.kiriage&&((I.han===4&&I.fu===30)||(I.han===3&&I.fu===60));
      sub=I.fu+"符 "+I.han+"翻"+(ki?"（切り上げ満貫）":(I.han>=6?"（跳満）":(I.han===5?"（満貫）":"")));
    }
    ro.append(document.createTextNode(head));
    if(S.honba||S.kyotaku||sub){
      const ex=[];if(sub)ex.push(sub);

      ro.append(ce("small",null,ex.join("　")));

    pn.append(ro);
    // タブ

      const g=ce("div","pad g4");
      fixedList(seat,UI.tsumo).forEach(o=>{
        const b=ce("button","k"+(o.big?" hi":"")+(I.base===o.base?" on":""),o.label);
        b.onclick=()=>{I.base=o.base;I.raw=null;draw()};g.append(b);

      }

      const g2=ce("div","pad g6");
      [20,25,30,40,50,60,70,80,90,100,110].forEach(fu=>{

    }else{
      const wrap=ce("div","pad");
      const keys=UI.tsumo?(seat===dealer()?[["各子から","rk"]]:[["子から（各）","rk"],["親から","ro"]]):[["点数（合計）","raw"]];
      keys.forEach(([lbl,key])=>{
        const f=ce("div","field");f.append(ce("label",null,lbl));
        const i2=ce("input");i2.type="number";i2.inputMode="numeric";i2.step="100";

        f.append(i2);wrap.append(f);

      pn.append(wrap);
    }
    bd.append(pn);scr.append(bd);

    const ft=ce("div","sfoot");

    const next=ce("button","btn primary","次へ");
    next.disabled=UI.winners.some(s=>!winValue(s));
    next.onclick=()=>{
      const wins=winsFrom(),loser=UI.loser,tsumo=UI.tsumo;
      closeScreen();resetUI();applyHora(wins,loser,tsumo);
    };
    ft.append(note,next);scr.append(ft);
  };
  draw();
}

      card.append(sg);
      card.append(ce("div","sec","名簿"));

      if(!names.length)mm.append(ce("span","note","まだ登録がありません。下から追加してください。"));
      names.forEach(n=>{
        const used=S.names.indexOf(n);
        const b=ce("button",used>=0?(used===cur?"on":"used"):"",n);
        b.onclick=()=>{
          if(used>=0&&used!==cur)S.names[used]="";

          const nx=S.names.findIndex(x=>!x);if(nx>=0)cur=nx;

        mm.append(b);
      });

      vf.append(vsel);add.append(vf);
      const vp=ce("button","btn sm","▶");
      vp.onclick=e=>{e.preventDefault();playVoice(vsel.value,inp.value||"")};
      add.append(vp);
      const ab=ce("button","btn","追加してこの席に");
      const doAdd=()=>{
        const m=addMember(inp.value);if(!m)return;
        setVoice(m.name,vsel.value);setYomi(m.name,yinp.value);yinp.value="";
        const used=S.names.indexOf(m.name);
        if(used>=0&&used!==cur)S.names[used]="";

/* 五捨六入：500点以下は切り捨て、600点以上は切り上げ（符号はそのまま） */
function g56(diff){
  const sg=diff<0?-1:1,ab=Math.abs(diff);
  return sg*(Math.floor(ab/1000)+((ab%1000)>=600?1:0));
}
const money=pt=>Math.round(pt*(R.rate||0));
const yen=pt=>R.rate?fmt(money(pt))+R.rateUnit:"";
function settle(g){
  const ru=g.rules||snapRules();
  const a=[0,1,2,3].map(i=>({i,name:g.names[i],pts:g.pts[i]}));
  a.sort((x,y)=>y.pts-x.pts||x.i-y.i);
  const U=UMA[ru.umaKey]||UMA["10-20"];
  const oka=ru.oka?(ru.ret-ru.start)*4/1000:0;
  a.forEach((x,k)=>{x.rank=k+1;x.uma=U[k];x.oka=k===0?oka:0});
  if(ru.gosha!==false){
    // 2〜4位を五捨六入し、1位で帳尻を合わせる（合計が必ずゼロになる）
    const total=Math.round((g.pts.reduce((t,p)=>t+p,0)-ru.ret*4)/1000);
    let acc=0;
    a.forEach((x,k)=>{if(k>0){x.score=g56(x.pts-ru.ret);acc+=x.score}});
    a[0].score=total-acc;
  }else{
    a.forEach(x=>{x.score=(x.pts-ru.ret)/1000});
  }
  if(R.yakitori){
    const lose=[0,1,2,3].filter(i=>!g.st[i].agari),win=[0,1,2,3].filter(i=>g.st[i].agari);
    if(lose.length&&win.length){
      const pen=R.yakitoriPt/1000,pool=pen*lose.length/win.length;
      a.forEach(x=>x.yk=lose.includes(x.i)?-pen:pool);
    }
  }
  a.forEach(x=>x.total=r1(x.score+x.uma+x.oka+(x.yk||0)));
  return a;
}
function buildRecord(){
  const res=settle(S),ru=S.rules||snapRules();
  const mins=Math.max(1,Math.round(((S.end||Date.now())-S.ts)/60000));
  return {gid:S.gid,ts:S.ts,end:S.end||Date.now(),hands:S.hands,note:S.endNote,
    rule:(ru.length==="tonpuu"?"東風":"半荘")+"／ウマ"+ru.umaKey+(ru.oka?"／オカ有":"／オカ無"),
    umaKey:ru.umaKey,mins,names:S.names.slice(),graph:S.log.map(l=>l.after),
    rows:res.map(x=>{const st=S.st[x.i];
      return {seat:x.i,name:x.name,rank:x.rank,pts:x.pts,score:r1(x.score),
        uma:r1(x.uma+x.oka+(x.yk||0)),total:x.total,hands:S.hands,
        agari:st.agari,houju:st.houju,riichi:st.riichi,tsumo:st.tsumo,
        agariPts:st.agariPts,houjuPts:st.houjuPts,oyaAgari:st.oyaAgari,renchan:st.renchan,
        tobi:x.pts<0?1:0,mins}})};
}

async function syncCall(payload){

  const res=await fetch(CFG.endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({key:CFG.key},extra,payload))});
  if(!res.ok)throw new Error("HTTP "+res.status);

  if(!j.ok)throw new Error(j.error||"error");

function applySettings(rm){
  if(!rm)return false;
  const mine=setAt(),remoteNewer=(rm.at||0)>mine;
  let ch=false;
  (rm.members||[]).forEach(m=>{
    if(!MEM.some(x=>x.name===m.name)){MEM.push(m);ch=true}
  });
  Object.keys(rm.yomi||{}).forEach(k=>{
    if(YLOCAL[k]!==rm.yomi[k]&&(remoteNewer||!YLOCAL[k])){YLOCAL[k]=rm.yomi[k];ch=true}
  });
  Object.keys(rm.voices||{}).forEach(k=>{
    if(VLOCAL[k]!==rm.voices[k]&&(remoteNewer||!VLOCAL[k])){VLOCAL[k]=rm.voices[k];ch=true}
  });
  if(remoteNewer&&rm.rules){R=Object.assign({},DEF,rm.rules);ch=true}
  if(ch){
    LS.set(K.m,MEM);LS.set("jt2.yomi",YLOCAL);LS.set("jt2.vmap",VLOCAL);LS.set(K.r,R);
    if(remoteNewer)LS.set("jt2.setAt",rm.at);
  }
  return ch;
}

/* ---- グラフ ---- */
function graphEl(series,names,start){
  const wrap=ce("div"),hex=["#BE8A2E","#4285C7","#C85040","#9068CC"];
  start=start||25000;
  const pts=[[start,start,start,start]].concat(series||[]);
  if(pts.length<2){wrap.append(ce("p","note","記録がありません。"));return wrap}
  const W=680,H=240,ML=52,MR=70,MT=16,MB=28;
  let lo=Infinity,hi=-Infinity;
  pts.forEach(p=>p.forEach(v=>{lo=Math.min(lo,v);hi=Math.max(hi,v)}));
  const step=10000;
  lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  if(hi-lo<step*2)hi=lo+step*2;
  const x=i=>ML+(W-ML-MR)*(i/(pts.length-1));
  const y=v=>MT+(H-MT-MB)*(1-(v-lo)/(hi-lo));
  const ns="http://www.w3.org/2000/svg";
  const mk=(t,a)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);return e};
  const svg=mk("svg",{viewBox:"0 0 "+W+" "+H,width:"100%",role:"img","aria-label":"持ち点の推移"});
  svg.style.maxWidth="100%";svg.style.display="block";
  for(let v=lo;v<=hi;v+=step){
    svg.append(mk("line",{x1:ML,x2:W-MR,y1:y(v),y2:y(v),stroke:"#1C4536","stroke-width":1}));
    const tx=mk("text",{x:ML-8,y:y(v)+4,fill:"#5C7A6D","font-size":11,"text-anchor":"end"});
    tx.textContent=(v/1000)+"k";svg.append(tx);
  }
  svg.append(mk("line",{x1:ML,x2:W-MR,y1:y(start),y2:y(start),stroke:"#5C7A6D","stroke-width":1,"stroke-dasharray":"3 3"}));
  for(let i=0;i<pts.length;i++){
    const tx=mk("text",{x:x(i),y:H-9,fill:"#5C7A6D","font-size":10,"text-anchor":"middle"});
    tx.textContent=i===0?"開局":String(i);svg.append(tx);
  }
  for(let s=0;s<4;s++){
    const d=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p[s]).toFixed(1)).join(" ");
    svg.append(mk("path",{d,fill:"none",stroke:hex[s],"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
    const li=pts.length-1;
    svg.append(mk("circle",{cx:x(li),cy:y(pts[li][s]),r:4.5,fill:hex[s],stroke:"#0B2019","stroke-width":2}));
    const tx=mk("text",{x:W-MR+8,y:y(pts[li][s])+4,fill:hex[s],"font-size":11});
    tx.textContent=(names[s]||"").slice(0,5);svg.append(tx);
  }
  const cross=mk("line",{x1:0,x2:0,y1:MT,y2:H-MB,stroke:"#8AA89A","stroke-width":1,opacity:0});
  svg.append(cross);
  const tip=ce("div");
  tip.style.cssText="font-family:var(--num);font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim);min-height:18px;margin-top:4px";
  svg.addEventListener("pointermove",e=>{
    const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W;
    let i=Math.round((px-ML)/((W-ML-MR)/(pts.length-1)));
    i=Math.max(0,Math.min(pts.length-1,i));
    cross.setAttribute("x1",x(i));cross.setAttribute("x2",x(i));cross.setAttribute("opacity","1");
    tip.textContent=(i===0?"開局":i+"局終了")+"　"+names.map((n,s)=>n+" "+fmt(pts[i][s])).join("　");
  });
  svg.addEventListener("pointerleave",()=>{cross.setAttribute("opacity","0");tip.textContent=""});
  wrap.append(svg,tip);
  const lg=ce("div","legend");

/* ---- 成績 ---- */
let RANGE=LS.get("jt2.range","all"),RFROM="",RTO="";
const RANGES=[["全期間","all"],["直近24時間","24h"],["直近3日","3d"],["直近7日","7d"],["直近30日","30d"],["期間を指定","custom"]];
function rangeFrom(){
  const D=864e5;
  if(RANGE==="24h")return Date.now()-D;
  if(RANGE==="3d")return Date.now()-3*D;
  if(RANGE==="7d")return Date.now()-7*D;
  if(RANGE==="30d")return Date.now()-30*D;
  if(RANGE==="custom"&&RFROM)return new Date(RFROM+"T00:00:00").getTime();
  return 0;
}
function rangeTo(){
  if(RANGE==="custom"&&RTO)return new Date(RTO+"T23:59:59").getTime();
  return Infinity;
}
function filteredRecs(){
  if(RANGE==="all")return RECS;
  const a=rangeFrom(),b=rangeTo();
  return RECS.filter(r=>{const t=r.end||r.ts;return t>=a&&t<=b});
}
function rangeLabel(){
  const o=RANGES.find(x=>x[1]===RANGE);
  if(RANGE==="custom")return (RFROM||"?")+" 〜 "+(RTO||"今日");
  return o?o[0]:"全期間";
}
/* 誰が誰にいくら払うか（やり取りの回数が最小になるように組む） */
function transfers(rows){
  const pos=rows.filter(r=>r.pt>0.05).map(r=>({n:r.name,v:r.pt})).sort((a,b)=>b.v-a.v);
  const neg=rows.filter(r=>r.pt<-0.05).map(r=>({n:r.name,v:-r.pt})).sort((a,b)=>b.v-a.v);
  const out=[];let i=0,j=0,guard=0;
  while(i<neg.length&&j<pos.length&&guard++<64){
    const m=Math.min(neg[i].v,pos[j].v);
    out.push({from:neg[i].n,to:pos[j].n,v:r1(m)});
    neg[i].v-=m;pos[j].v-=m;
    if(neg[i].v<0.05)i++;
    if(pos[j].v<0.05)j++;
  }
  return out;
}

      [1,2,3,4].forEach(han=>{const b=basePts(fu,han);html+="<td>"+ceil100(b*4)+" / "+ceil100(b*6)+"</td>"});
      tr.innerHTML=html;tb.append(tr);
    });
    t.append(tb);sc.append(t);card.append(sc);
    const f=ce("div","row");f.style.justifyContent="flex-end";
    const b=ce("button","btn gold","閉じる");b.onclick=close;f.append(b);card.append(f);
  });
}

/* ---- 起動 ---- */
$("#btnMenu").onclick=openMenu;
$("#btnUndo").onclick=doUndo;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.phase!=="setup")closeOv()});
let unlocked=false;
document.addEventListener("pointerdown",()=>{
  if(unlocked||!window.speechSynthesis)return;unlocked=true;
  try{const u=new SpeechSynthesisUtterance(" ");u.lang="ja-JP";u.volume=0;speechSynthesis.speak(u)}catch(e){}
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
},{once:true});
render();
if(S.phase==="setup")openSeatPicker();
loadVoiceManifest();loadUserVoices();
if(syncOn()){syncFlush().then(syncPull).then(syncState)}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
